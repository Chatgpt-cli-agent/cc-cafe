name: Refresh App Lockfile

on:
  push:
    branches:
      - feature/create-studio-foundation
    paths:
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/refresh-app-lock.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Refresh package lock
        working-directory: ./app
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-app-package-lock
          path: app/package-lock.json
          if-no-files-found: error
          retention-days: 1
